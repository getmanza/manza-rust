name: Release

# Tag-driven release. Mirrors manza-ruby: test gate, tag/version check,
# then crates.io Trusted Publishing (OIDC via rust-lang/crates-io-auth-action
# — no long-lived token), then a GitHub release.
#
# One-time setup on crates.io (after the first publish): crate settings →
# Trusted Publishing → add GitHub repository getmanza/manza-rust, workflow
# release.yml, environment crates-io.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  publish:
    needs: test
    runs-on: ubuntu-26.04
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$CRATE_VERSION" ]]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
      # crates.io refuses to overwrite a published version, so a re-run (or a
      # bin/release --force re-cut) skips the publish instead of failing.
      - name: Check whether this version is already on crates.io
        id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 -A "manza-rust release (github.com/getmanza/manza-rust)" "https://crates.io/api/v1/crates/manza/${TAG#v}")
          case "$status" in
            200)
              echo "::warning::manza ${TAG#v} is already on crates.io, skipping the publish"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404) ;;
            *)
              echo "::error::crates.io lookup for manza ${TAG#v} returned HTTP $status"
              exit 1
              ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.exists != 'true'
        id: auth
      - if: steps.published.outputs.exists != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bin/release creates the release (and the tag) itself; only a tag
        # pushed by hand reaches here without one.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published"
          else
            gh release create "$tag" --title "$tag" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          fi
