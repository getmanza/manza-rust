[package]
name = "manza"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for the Manza API"
repository = "https://github.com/getmanza/manza-rust"

[lib]
name = "manza"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
base64 = "0.22"
serde_yaml = "0.9"
tiny_http = "0.12"
